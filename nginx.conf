user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    
    # Port in redirect off to preserve port in redirects
    port_in_redirect off;
    
    # Gzip compression for better performance
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        listen 80;
        server_name resume.mintmelon.ca;
        # server_name localhost;
        root /usr/share/nginx/html;

        # Handle requests to /toolbar path
        location /toolbar/ {
            # This will look in the /usr/share/nginx/html/toolbar directory
            try_files $uri $uri/ =404;
        }

        # Next.js app under /modifier path
        location /modifier/ {
            alias /usr/share/nginx/html/modifier/;
            try_files $uri $uri.html $uri/index.html =404;
            
            # Add proper caching headers
            location /modifier/_next/static/ {
                alias /usr/share/nginx/html/modifier/_next/static/;
                expires 365d;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
            
            # Cache public assets
            location /modifier/public/ {
                alias /usr/share/nginx/html/modifier/public/;
                expires 7d;
                add_header Cache-Control "public, max-age=604800";
            }
        }
        
        # Redirect root to /modifier
        location = / {
            return 301 /modifier/;
        }

        # For API proxy if needed
        location /api/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Proxy to backend API
            proxy_pass https://resume.mintmelon.ca/api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Error handling
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
} 